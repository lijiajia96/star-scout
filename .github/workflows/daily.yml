name: ai-issue-radar-daily

on:
  schedule:
    # 每天 01:17 UTC = 09:17 北京时间（避开整点 GitHub 高负载）
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防止重复触发导致两个 run 同时提交（曾出现 dynamic + workflow_dispatch 并发）
concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发现腰部候选（仅手动触发时执行）
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 discover.py

      - name: 每日采集（配额预算内 + 最久未采集优先轮转）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collect.py

      - name: 数据维护（归档僵尸 issue / 精简候选 / VACUUM）
        run: python3 maintain.py all

      - name: 信号分析
        run: python3 analyze.py

      - name: 推荐 Top N（值得跟踪 issue / 提 PR）
        run: python3 recommend.py --top 5

      - name: 生成网页看板 + README 排行榜
        run: python3 build_dashboard.py

      - name: 提交数据快照回仓库
        run: |
          git config user.name "ai-issue-radar[bot]"
          git config user.email "ai-issue-radar[bot]@users.noreply.github.com"
          git add data/ docs/ README.md
          git diff --cached --quiet || git commit -m "daily snapshot $(date +%F)"
          # 并发/竞态时先 rebase 再推，避免整轮数据丢失
          git pull --rebase --autostash origin main || true
          git push
